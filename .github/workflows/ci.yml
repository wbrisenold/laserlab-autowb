name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd LaserLabOFX
          make clean all

      - name: CPU Tests
        run: |
          cd LaserLabOFX
          make test

      - name: Metal GPU Test
        run: |
          cd LaserLabOFX
          make test_autowb
